<!DOCTYPE html>

<html>

	<head>
		<title>Table Example</title>
	</head>
	
	<body>
		<h2>Student Marks Table</h2>
	
		<table border="1" cellspacing="4" cellpadding="10" width="100%" >
			
			<caption><b/>Class 10 - Final Result</caption>
			
			<thead bgcolor="#e0e0e0">
				
				<tr>
					<th>Roll No</th>
					<th>Name</th>
					<th colspan="3">Subjects</th>
					<th>Total</th>
				</tr>
				
				<tr>
					<th></th>
					<th></th>
					<th>Math</th>
					<th>Science</th>
					<th>English</th>
					<th></th>
				</tr>
			
			</thead>
			
			<tbody>
				
				<tr>
					<td>1</td>
					<td>Rupali</td>
					<td>85</td>
					<td>73</td>
					<td>90</td>
					<td>248</td>
				</tr>
				
				<tr>
					<td>2</td>
					<td>Suraj</td>
					<td>70</td>
					<td>88</td>
					<td>85</td>
					<td>243</td>
				</tr>
			
			</tbody>
			
			<tfoot bgcolor="#d0ffd0">
				<td colspan="5" align="right"><b>Average</b></td>
				<td>246.5</td>
			</tfoot>
			
		</table>
		
	</body>

</html>
