<!DOCTYPE html>
<html>

	<head>
		<title>form</title>
	</head>

	<body>
		<center>
			<h2> Job Aplication Form</h2>
				<form>
				
					<table border="1" cellspacing="0" cellpadding="5">
					
						<div>
							<tr>
								<th><label>Full Name:<label></th>
								<td><input type="text" placeholder="Enter your name"></td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Email Address:<label></th>
								<td><input type="email" placeholder="example@gmail.com"></td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Phone Number:<label></th>
								<td><input type="number" placeholder="+xxx xxx xxxx"></td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Gender:<label></th>
								<td><input type="radio" name="gender">Male
								<input type="radio" name="gender">Female
								<input type="radio" name="gender">Other</td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Job Role:<label></th>
								<td>
									<select placeholder="select job">
							
										<option>--Select Job--</option>
										<option>HR</option>
										<option>Manager</option>
										<option>Employer</option>
										<option>Project Manager</option>
								
									</select>
								</td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Date:<label></th>
								<td><input type="date"></td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Favorite Color:<label></th>
								<td><input type="color" name="favorite"></td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Upload Resume:<label></th>
								<td><input type="file" name="My file"></td>
							</tr>
						</div>
					
						<div>
							<tr>
								<th><label>Skills:<label></th>
								<td>
									<input type="checkbox" name="skills" value="html">HTML
									<input type="checkbox" name="skills" value="css">CSS
									<input type="checkbox" name="skills" value="js">JS
									<input type="checkbox" name="skills" value="react">React
								</td>
							</tr>
						</div>
						
						<div>
							<tr>
								<th><label>Covar Letter:<label></th>
								<td>
									<textarea name="comments" rows="4" cols="40" placeholder="Write something about your self..."></textarea>
								</td>
							</tr>
						</div>
						
						<div>
							<tr>
					
								<th colspan="2">
									<button type="submit">submit</button> 
								    <button type="reset">reset</button>
								</th>
					
							</tr>
						</div>
						
					</table>
					
				</form>
		
		</center>
	</body>
</html>
